version: "3.8"  # 3.9 ou 3.8, tanto faz

services:
  rl-trainer:
    build: .
    container_name: rl_trainer_container
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ./src:/workspace/app
      - ./src/ppo:/workspace/app/logs
      - ./src/test_results:/workspace/app/test_results
      - ./src/train:/workspace/app/train
      - ./src/envivio:/workspace/app/envivio
      - ./src/pretrain:/workspace/app/pretrain
      - ./src/test:/workspace/app/test
    command: python train.py
