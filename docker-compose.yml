version: "3.9"

services:
  rl-trainer:
    build: .
    container_name: rl_trainer_container
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - .:/workspace/app
      - ./src/logs:/workspace/app/logs
      - ./src/test_results:/workspace/app/test_results
    command: python src/train.py
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
